[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secretmap"
version = "0.1.0"
description = "A backend-agnostic secret consumer/lineage manifest: know what breaks before you delete or rotate a secret."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Roman Tesla" }]
keywords = ["secrets", "credentials", "vault", "vaultwarden", "bitwarden", "rotation", "infrastructure"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]

[project.scripts]
secretmap = "secretmap.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["secretmap"]
